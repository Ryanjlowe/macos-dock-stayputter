<svg xmlns="http://www.w3.org/2000/svg" width="820" height="580" viewBox="0 0 820 580" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <title>A wide main display above a MacBook display. The Dock stays on the main display's bottom edge. The cursor is fenced 2 px above the bottom edge of the MacBook display, so the Dock can't jump down.</title>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b6fd4"/>
      <stop offset="1" stop-color="#8a4fc9"/>
    </linearGradient>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#e5534b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Main display (wide, on top) -->
  <g transform="translate(40 24)">
    <rect x="0" y="0" width="560" height="230" rx="12" fill="#1f2328" stroke="#6e7781" stroke-width="2"/>
    <rect x="10" y="10" width="540" height="210" rx="6" fill="url(#screen)"/>
    <!-- menu bar -->
    <rect x="10" y="10" width="540" height="16" rx="6" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="24" cy="18" r="4" fill="#1f2328" fill-opacity="0.7"/>
    <rect x="34" y="15" width="40" height="6" rx="3" fill="#1f2328" fill-opacity="0.5"/>
    <!-- status item icon -->
    <rect x="522" y="13" width="16" height="10" rx="2" fill="none" stroke="#1f2328" stroke-opacity="0.8" stroke-width="1.5"/>
    <line x1="522" y1="20" x2="538" y2="20" stroke="#1f2328" stroke-opacity="0.8" stroke-width="1.5"/>
    <!-- dock, pinned to the bottom edge -->
    <rect x="196" y="184" width="168" height="30" rx="8" fill="#ffffff" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.6"/>
    <g fill="#ffffff" fill-opacity="0.9">
      <rect x="204" y="190" width="18" height="18" rx="4"/>
      <rect x="228" y="190" width="18" height="18" rx="4"/>
      <rect x="252" y="190" width="18" height="18" rx="4"/>
      <rect x="276" y="190" width="18" height="18" rx="4"/>
      <rect x="300" y="190" width="18" height="18" rx="4"/>
      <rect x="324" y="190" width="18" height="18" rx="4"/>
    </g>
    <!-- label on the left, pointing at the Dock -->
    <text x="18" y="190" fill="#ffffff" font-weight="600" font-size="13">Dock stays here</text>
    <line x1="120" y1="186" x2="190" y2="196" stroke="#ffffff" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  </g>
  <text x="40" y="282" fill="#6e7781" font-weight="600">Main display (menu bar)</text>
  <text x="40" y="300" fill="#6e7781">Never fenced. Push the cursor against</text>
  <text x="40" y="318" fill="#6e7781">its bottom edge, left of the MacBook,</text>
  <text x="40" y="336" fill="#6e7781">to bring the Dock back here.</text>

  <!-- MacBook display (smaller, below, offset right) -->
  <g transform="translate(290 254)">
    <rect x="0" y="0" width="300" height="190" rx="10" fill="#1f2328" stroke="#6e7781" stroke-width="2"/>
    <rect x="10" y="10" width="280" height="170" rx="5" fill="url(#screen)"/>
    <!-- green arrow crossing the shared edge from the main display -->
    <path d="M150 -40 L150 44" fill="none" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="160" y="-8" fill="#ffffff" font-size="12">cursor crosses freely</text>
    <!-- ghost dock that never arrives -->
    <rect x="70" y="140" width="160" height="28" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-dasharray="5 4"/>
    <line x1="80" y1="142" x2="220" y2="166" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
    <line x1="220" y1="142" x2="80" y2="166" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
    <!-- fence line, 2 px above the bottom edge -->
    <line x1="10" y1="174" x2="290" y2="174" stroke="#ffd33d" stroke-width="2" stroke-dasharray="8 5"/>
    <!-- cursor path stopped at the fence -->
    <path d="M150 54 C 190 80, 230 120, 252 168" fill="none" stroke="#e5534b" stroke-width="2.5" marker-end="url(#arrowRed)"/>
    <path d="M254 170 l0 -14 l10 10 l-4 0 l3 6 l-3 1 l-3 -6 z" fill="#ffffff" stroke="#1f2328" stroke-width="1"/>
    <!-- laptop base -->
    <path d="M-20 192 L320 192 L330 206 L-30 206 Z" fill="#6e7781"/>
    <rect x="120" y="192" width="60" height="4" fill="#1f2328" fill-opacity="0.5"/>
  </g>
  <text x="440" y="490" text-anchor="middle" fill="#6e7781" font-weight="600">Secondary display (MacBook)</text>
  <text x="440" y="508" text-anchor="middle" fill="#6e7781">Cursor stops 2 px above the bottom edge, so the Dock can never jump down here.</text>

  <!-- legend -->
  <g transform="translate(40 548)">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#ffd33d" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="36" y="4" fill="#6e7781">Cursor fence, 2 px above the edge</text>
    <line x1="290" y1="0" x2="318" y2="0" stroke="#e5534b" stroke-width="2.5"/>
    <text x="326" y="4" fill="#6e7781">Cursor stopped</text>
    <line x1="460" y1="0" x2="488" y2="0" stroke="#3fb950" stroke-width="2.5"/>
    <text x="496" y="4" fill="#6e7781">Cursor passes through</text>
  </g>
</svg>
