<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Dock Stay Putter app icon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a7de0"/>
      <stop offset="1" stop-color="#7d3fc4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pinHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#d93636"/>
    </linearGradient>
    <linearGradient id="pinNeedle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset="1" stop-color="#b8bcc4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- soft gloss on the upper half -->
    <rect x="100" y="100" width="824" height="420" fill="url(#gloss)"/>
    <!-- bottom-edge fence line -->
    <line x1="150" y1="866" x2="874" y2="866" stroke="#ffd33d" stroke-width="14" stroke-linecap="round" stroke-dasharray="48 34"/>
  </g>

  <!-- dock tray -->
  <g filter="url(#shadow)">
    <rect x="196" y="640" width="632" height="150" rx="40" fill="#ffffff" fill-opacity="0.28" stroke="#ffffff" stroke-opacity="0.55" stroke-width="6"/>
    <g fill="#ffffff" fill-opacity="0.95">
      <rect x="236" y="672" width="86" height="86" rx="22"/>
      <rect x="350" y="672" width="86" height="86" rx="22"/>
      <rect x="464" y="672" width="86" height="86" rx="22"/>
      <rect x="578" y="672" width="86" height="86" rx="22"/>
      <rect x="692" y="672" width="86" height="86" rx="22"/>
    </g>
  </g>

  <!-- pushpin holding the dock in place -->
  <g filter="url(#shadow)" transform="translate(605 405) rotate(28)">
    <!-- needle -->
    <path d="M-10 150 L0 330 L10 150 Z" fill="url(#pinNeedle)"/>
    <!-- collar -->
    <rect x="-70" y="120" width="140" height="40" rx="16" fill="#e9ecef"/>
    <!-- body -->
    <path d="M-92 120 L-62 -40 L62 -40 L92 120 Z" fill="url(#pinHead)"/>
    <!-- head -->
    <rect x="-110" y="-90" width="220" height="64" rx="28" fill="url(#pinHead)"/>
    <rect x="-96" y="-82" width="192" height="18" rx="9" fill="#ffffff" fill-opacity="0.35"/>
  </g>
</svg>
